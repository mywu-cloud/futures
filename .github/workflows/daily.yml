name: 外資持倉成本每日更新

on:
  schedule:
    # GitHub cron 為 UTC：10:00 UTC = 台灣 18:00，週一至週五（GitHub 排程常延遲數分鐘至數十分鐘）
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "期交所回補天數（僅在 data/taifex_raw.csv 不存在時生效）"
        default: "730"
      rebuild:
        description: "資料未變動也強制重建 xlsx / json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取資料
        id: fetch
        continue-on-error: true
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days || '730' }}
          REBUILD: ${{ inputs.rebuild && '--rebuild' || '' }}
        run: python foreign_cost_tracker.py --backfill-days "$BACKFILL_DAYS" $REBUILD

      - name: Commit 資料
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料"
          else
            git commit -m "data: 外資持倉成本 $(TZ=Asia/Taipei date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: 抓取失敗時標示紅叉（觸發通知信）
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::期交所資料抓取失敗，請查看「抓取資料」步驟的 log"
          exit 1
